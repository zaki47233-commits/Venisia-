<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0a3a36">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Venisia Luxury</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Playfair+Display:wght@600&display=swap" rel="stylesheet">
<style>
:root{--green:#0a3a36;--gold:#d4b87a;--bg:#f8f6f1;--ink:#12302d;--muted:#6b7b78;--card:#fff;--ok:#1d8a5b;--err:#c0392b}
*{box-sizing:border-box;margin:0}
body{font-family:Cairo,sans-serif;background:var(--bg);color:var(--ink);padding-bottom:30px}
header{background:var(--green);padding:14px 18px;display:flex;align-items:center;justify-content:space-between}
header .brand{font-family:'Playfair Display',serif;color:#fff;line-height:1.1}
header .brand span{color:var(--gold);display:block;font-size:1.1rem}
header .brand b{font-size:1.5rem}
.logo{width:48px;height:48px;border-radius:50%;background:#fff;color:var(--green);display:grid;place-items:center;font-family:'Playfair Display',serif;font-size:1.3rem}
main{padding:16px;max-width:560px;margin:auto}
.hero{background:var(--green);color:#fff;border-radius:28px;padding:22px;margin-bottom:16px}
.hero h1{font-size:1.5rem;margin:6px 0}
.hero p{opacity:.85;font-size:.95rem}
.card{background:var(--card);border-radius:22px;padding:16px;margin-bottom:14px;box-shadow:0 4px 18px rgba(0,0,0,.05)}
.card h2{font-size:1.05rem;margin-bottom:10px}
.step{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--gold);color:var(--green);font-size:.85rem;margin-inline-start:6px}
button,.btn{font-family:inherit;border:0;border-radius:14px;padding:11px 16px;font-size:.95rem;font-weight:600;cursor:pointer;background:var(--gold);color:var(--green)}
button.sec{background:#eef1ef;color:var(--ink)}
button:disabled{opacity:.5}
.drop{display:block;border:2px dashed var(--gold);border-radius:18px;padding:26px;text-align:center;color:var(--muted);cursor:pointer}
.preview{width:100%;border-radius:16px;margin-top:10px;display:none;background:
 conic-gradient(#eee 25%,#fff 0 50%,#eee 0 75%,#fff 0) 0 0/16px 16px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.chip{padding:8px 14px;border-radius:999px;background:#eef1ef;cursor:pointer;font-size:.9rem;border:2px solid transparent}
.chip.on{border-color:var(--gold);background:#fbf5e6}
.sw{width:34px;height:34px;border-radius:50%;border:2px solid #ddd;cursor:pointer}
.sw.on{border-color:var(--green);box-shadow:0 0 0 2px var(--gold)}
input[type=text],select,textarea{width:100%;font-family:inherit;font-size:.95rem;padding:10px 12px;border:1px solid #dfe5e3;border-radius:12px;background:#fff;margin-top:8px}
textarea{min-height:110px;resize:vertical}
.sug{background:#faf8f3;border-radius:14px;padding:12px;margin-top:8px;cursor:pointer;border:2px solid transparent;font-size:.92rem;line-height:1.7}
.sug:hover{border-color:var(--gold)}
.sug small{color:var(--muted);display:block;margin-top:4px}
.plats .chip{display:flex;align-items:center;gap:6px}
.publish{width:100%;padding:15px;font-size:1.1rem;background:var(--green);color:#fff;margin-top:6px}
.toast{position:fixed;bottom:18px;inset-inline:16px;max-width:520px;margin:auto;padding:13px 16px;border-radius:14px;color:#fff;display:none;z-index:9;font-size:.95rem}
.toast.ok{background:var(--ok)}.toast.err{background:var(--err)}
.status{font-size:.8rem;color:var(--muted);margin-top:8px}
.status b{color:var(--err)}
</style>
</head>
<body>
<header>
  <div class="logo">V</div>
  <div class="brand"><b>Venisia</b><span>Luxury</span></div>
</header>

<main>
  <section class="hero">
    <p>مرحباً بك</p>
    <h1>✨ اصنع محتواك بذكاء</h1>
    <p>حسّن صورتك، اكتب منشورك، وانشر على تيكتوك وإنستغرام وفيسبوك بلمسة واحدة.</p>
    <div class="status" id="status"></div>
  </section>

  <section class="card">
    <h2><span class="step">1</span>الصورة</h2>
    <label class="drop" id="drop">اضغط لاختيار صورة<input id="file" type="file" accept="image/*" hidden></label>
    <img id="preview" class="preview" alt="">
  </section>

  <section class="card">
    <h2><span class="step">2</span>AI Studio — تحسين الصورة والخلفية</h2>
    <div class="row" id="bgModes">
      <div class="chip on" data-bg="remove">إزالة الخلفية</div>
      <div class="chip" data-bg="#ffffff">أبيض</div>
      <div class="chip" data-bg="#0a3a36">أخضر</div>
      <div class="chip" data-bg="#d4b87a">ذهبي</div>
      <div class="chip" data-bg="ai">خلفية بالذكاء الاصطناعي</div>
    </div>
    <input type="text" id="bgPrompt" placeholder="صف الخلفية (مثال: رخام أبيض مع إضاءة ناعمة)" style="display:none">
    <div class="row">
      <button id="enhanceBtn" disabled>طبّق التحسين</button>
      <button class="sec" id="resetBtn" style="display:none">الصورة الأصلية</button>
    </div>
  </section>

  <section class="card">
    <h2><span class="step">3</span>اقتراح المنشور</h2>
    <select id="lang">
      <option value="ar">العربية</option>
      <option value="fr">الفرنسية</option>
      <option value="both">العربية والفرنسية</option>
    </select>
    <select id="tone">
      <option>احترافي وجذاب</option>
      <option>فاخر وراقٍ</option>
      <option>ودّي ومرح</option>
      <option>تسويقي مباشر</option>
    </select>
    <input type="text" id="topic" placeholder="معلومات إضافية (اسم المنتج، السعر، العرض...) — اختياري">
    <div class="row"><button id="captionBtn" disabled>✨ اقترح منشوراً</button></div>
    <div id="sugs"></div>
    <textarea id="text" placeholder="نص المنشور..."></textarea>
  </section>

  <section class="card">
    <h2><span class="step">4</span>النشر</h2>
    <div class="row plats" id="plats">
      <div class="chip on" data-p="tiktok">🎵 تيكتوك</div>
      <div class="chip on" data-p="instagram">📸 إنستغرام</div>
      <div class="chip on" data-p="facebook">👍 فيسبوك</div>
    </div>
    <label style="display:block;margin-top:12px;font-size:.9rem;color:var(--muted)">جدولة (اختياري)
      <input type="datetime-local" id="when" style="width:100%;padding:10px;border:1px solid #dfe5e3;border-radius:12px;margin-top:6px">
    </label>
    <button class="publish" id="publishBtn" disabled>انشر الآن 🚀</button>
  </section>
</main>

<div class="toast" id="toast"></div>
<script src="app.js"></script>
</body>
</html>
